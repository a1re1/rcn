[workspace]
members = [".", "cli"]

[package]
name = "rcn"
version = "0.1.0"
edition = "2024"

[dependencies]
# gpui — Zed's UI framework — is the sole renderer + windowing layer. Not on
# crates.io; pinned to rcn's fork branch `rcn-gpui-patches` (a1re1/zed), which
# is upstream rev 027cf0d plus small upstreamable patches exposing taffy
# features (justify_items / justify_self / grid_auto_flow) for the tw mapping
# layer (see docs/tw-roadmap.md phase 3).
gpui = { git = "https://github.com/a1re1/zed", rev = "8ab2b7d11e60129864780c84f229ee7f5fe52b5f", package = "gpui" }
# The platform layer was split into gpui_platform; current_platform() builds the
# real macOS platform to hand to Application::with_platform (as in zed's own main).
# `font-kit` is REQUIRED: without it gpui_macos installs gpui::NoopTextSystem and
# NO glyphs render (quads still do). With it we get the real CoreText MacTextSystem.
gpui_platform = { git = "https://github.com/a1re1/zed", rev = "8ab2b7d11e60129864780c84f229ee7f5fe52b5f", package = "gpui_platform", features = ["font-kit"] }
# Grapheme-boundary navigation for the Input component (already in gpui's tree).
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep dev builds usable: optimize dependencies even in debug so rendering is
# snappy during development.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
